<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d18">
  <title>{% block title %}{{ biz.business_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="portal">
    {% block body %}{% endblock %}
    <div class="portal-foot">
      {{ biz.print_footer }}<br>
      <span class="mono">{{ settings.app_name }} v{{ app_version }}</span>
    </div>
  </div>
  <script src="/static/portal.js"></script>
</body>
</html>
