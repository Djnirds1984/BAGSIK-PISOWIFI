<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - {{ biz.business_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">BP</div>
        <div class="brand-text">
          <strong>{{ biz.business_name }}</strong>
          <span>Operator console</span>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          {% include "partials/flash.html" %}
          <form method="post" action="/admin/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" type="text" name="username" autocomplete="username"
                     autofocus required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" name="password"
                     autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          </form>
          <p class="hint" style="margin-top:14px;text-align:center">
            Default credentials come from BAGSIK_ADMIN_USER / BAGSIK_ADMIN_PASSWORD,
            then change the password in Settings.
          </p>
        </div>
      </div>

      <p class="hint" style="text-align:center;margin-top:14px">
        <a href="/">&larr; Back to the customer portal</a>
      </p>
    </div>
  </div>
</body>
</html>
